<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="css/style.css" />
		<link rel="icon" type="image/png" href="favicon.png" />

		<title>rupali morzaria</title>
		<meta name="title" content="rupali morzaria" />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://rupalimorzaria.com/" />
		<meta property="og:title" content="rupali morzaria" />
		<meta
			property="og:description"
			content=".¸¸.•༺ (c) 2021 to present ༻•.¸¸."
		/>
	</head>

	<!-- this website was designed & developed in plain html + css by rupali, also known online as shabana_asthma || font family: Arial & Times New Roman || last updated: April 8, 2024 -->

	<body>
		<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="0" width="0">
			<defs>
				<filter id="noise" x="0%" y="0%" width="100%" height="100%">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0 0.0025"
						result="NOISE"
						numOctaves="2"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="NOISE"
						scale="100"
						xChannelSelector="R"
						yChannelSelector="R"
					></feDisplacementMap>
				</filter>
			</defs>
		</svg>

		<header></header>

		<main class="rc">
			<details>
				<summary>Make a request...</summary>
				<div id="requestForm" class="request__form">
					<form name="requestClub-form" action="">
						<input type="hidden" name="submissions" value="submissions" />

						<p><label for="user">Username</label></p>
						<input type="text" id="user" name="user" />
						<p>
							<label for="request"
								>Describe what sort of vibe / mood / feeling / ambiance you are
								looking for? Be as specific or vague as you wish.</label
							>
						</p>
						<input
							id="request"
							name="request"
							type="text"
							placeholder="I am looking for..."
							maxlength="250"
							pattern="[^=+\-@].*"
						/>
						<div class="form-helper">
							<label>If you are human, leave this blank:</label>
							<input type="text" name="mobile_number" />
						</div>
						<button type="submit" class="btn">Send</button>
					</form>
				</div>
			</details>
			<section class="logo">
				<img src="request-club/black-cover.jpg" alt="" />
				<div class="requestIndex">
					<span id="requestEntry"></span>
					<div id="requestSong"></div>
				</div>
			</section>
		</main>

		<footer></footer>
		<script>
			const scriptURL =
				'https://script.google.com/macros/s/AKfycbylWlMr9NT2vlIGEtytnrOqF5tNwYbwSgaKUYqpAsEHYOUOzMviIE6qoz40Jgc81WrotA/exec';
			const form = document.forms['requestClub-form'];

			form.addEventListener('submit', (e) => {
				e.preventDefault();
				fetch(scriptURL, { method: 'POST', body: new FormData(form) })
					.then((response) => response.json())
					.then((response) => console.log('Success!', response))
					.catch((error) => console.error('Error!', error.message));
			});
		</script>
		<script
			src="https://code.jquery.com/jquery-3.6.0.min.js"
			type="text/javascript"
		></script>
		<script src="request-club/code-table.js" type="text/javascript"></script>
	</body>
</html>
