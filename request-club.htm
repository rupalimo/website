<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="css/style.css" />
		<link rel="icon" type="image/png" href="favicon.png" />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://rupalimorzaria.com/" />
		<meta property="og:title" content="rupali morzaria" />

			property="og:description"
			content=".¸¸.•༺ (c) 2021 to present ༻•.¸¸."

	<!-- this website was designed & developed in plain html + css by rupali, also known online as shabana_asthma || font family: Arial & Times New Roman || last updated: April 8, 2024 -->

	<body>
		<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="0" width="0">
			<defs>
				<filter id="noise" x="0%" y="0%" width="100%" height="100%">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0 0.0025"
						result="NOISE"
						numOctaves="2"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="NOISE"
						scale="100"
						xChannelSelector="R"
						yChannelSelector="R"
					></feDisplacementMap>
				</filter>
			</defs>
		</svg>

		<header></header>

		<main class="rc">
			<details>
				<summary>Make a request...</summary>
				<div class="request__form">
					<form
						id="requestForm"
						name="requestClub-form"
						method="POST"
						action="https://script.google.com/macros/s/AKfycbzp6yMrHVokzMtaboFPynhjSzo6r016iPFW1CaHkXDFXI_LwhDDTPSYg6_b58wGUThGwg/exec"
					>
						<input type="hidden" name="submissions" value="submissions" />

						<p><label for="user">Username</label></p>
						<input type="text" name="user" />
						<p><label for="Email">Email</label></p>
						<input name="Email" type="email" placeholder="Email" required />
						<input name="Name" type="text" placeholder="Name" required />
						<p>
							<label for="request"
								>Describe what sort of vibe / mood / feeling / ambiance you are
								looking for? Be as specific or vague as you wish.</label
							>
						</p>
						<input
							id="request"
							name="request"
							type="text"
							placeholder="I am looking for..."
							maxlength="250"
							pattern="[^=+\-@].*"
						/>
						<div class="form-helper">
							<label>If you are human, leave this blank:</label>
							<input type="text" name="mobile_number" />
						</div>
						<button type="submit" class="btn">Send</button>
					</form>
				</div>
			</details>
			<section class="logo">
				<img src="" alt="" />
				<div id="requestIndex"></div>
			</section>
		</main>

		<footer></footer>
		<script>
			window.addEventListener('load', function () {
				const form = document.getElementById('requestForm');
				form.addEventListener('submit', function (e) {
					e.preventDefault();
					const data = new FormData(form);
					const action = e.target.action;
					fetch(action, {
						method: 'POST',
						body: data,
					}).then(() => {
						alert('Success!');
					});
				});
			});
		</script>
		<script
			src="https://code.jquery.com/jquery-3.6.0.min.js"
			type="text/javascript"
		></script>
		<script src="request-club/code-table.js" type="text/javascript"></script>
	</body>
</html>
