	<!-- this website was designed & developed in plain html + css by rupali, also known online as shabana_asthma || font family: Arial & Times New Roman || last updated: April 8, 2024 -->

	<body>
		<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="0" width="0">
			<defs>
				<filter id="noise" x="0%" y="0%" width="100%" height="100%">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0 0.0025"
						result="NOISE"
						numOctaves="2"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="NOISE"
						scale="100"
						xChannelSelector="R"
						yChannelSelector="R"
					></feDisplacementMap>
				</filter>
			</defs>
		</svg>

		<header>
			<div class="logo">
				<img src="" alt="" />
			</div>
		</header>

		<main class="rc">
			<section class="request-index" id="requestIndex"></section>
			<section class="make-a-request">
				<details>
					<summary>Make a request...</summary>
					<div class="request__form">
						<form
							id="requestForm"
							name="requestClub-form"
							method="POST"
							action="https://script.google.com/macros/s/AKfycbzp6yMrHVokzMtaboFPynhjSzo6r016iPFW1CaHkXDFXI_LwhDDTPSYg6_b58wGUThGwg/exec"
						>
							<input type="hidden" name="submissions" value="submissions" />

							<input name="Name" type="text" placeholder="USER" required />

							<input name="Email" type="email" placeholder="EMAIL" required />

							<input
								id="request"
								name="Request"
								type="text"
								placeholder="SONG REQUEST"
								maxlength="250"
								pattern="[^=+\-@].*"
							/>
							<div class="form-helper">
								<label>If you are human, leave this blank:</label>
								<input type="text" name="mobile_number" />
							</div>

							<button type="submit" class="btn">Send</button>
						</form>
					</div>
				</details>
			</section>
		</main>

		<footer></footer>
		<script>
			window.addEventListener('load', function () {
				const form = document.getElementById('requestForm');
				form.addEventListener('submit', function (e) {
					e.preventDefault();
					const data = new FormData(form);
					const action = e.target.action;
					fetch(action, {
						method: 'POST',
						body: data,
					}).then(() => {
						alert('Success!');
					});
				});
			});
		</script>
		<script
			src="https://code.jquery.com/jquery-3.6.0.min.js"
			type="text/javascript"
		></script>
		<script src="request-club/code-table.js" type="text/javascript"></script>
	</body>
</html>
