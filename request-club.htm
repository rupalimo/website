	<body>
		<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="0" width="0">
			<defs>
				<filter id="noise" x="0%" y="0%" width="100%" height="100%">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0 0.0025"
						result="NOISE"
						numOctaves="2"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="NOISE"
						scale="100"
						xChannelSelector="R"
						yChannelSelector="R"
					></feDisplacementMap>
				</filter>
			</defs>
		</svg>

		<header></header>

		<main class="rc">
			<details>
				<summary>Make a request...</summary>
				<div id="requestForm" class="request__form">
					<form name="requestClub-form" action="">
<input type="hidden" name="submissions" value="submissions" />
						
						<p><label for="user">Username</label></p>
						<input type="text" id="user" name="user" />
						<p>
							<label for="request"
								>Describe what sort of vibe / mood / feeling / ambiance you are
								looking for? Be as specific or vague as you wish.</label
							>
						</p>
						<input id="request" name="request"></input>
						<button type="submit" class="btn">Send</button>
					</form>
				</div>
			</details>
			<section class="logo">
				<img src="" alt="" />
			</section>
		</main>

		<footer></footer>
		<script>
	const scriptURL = 'https://script.google.com/macros/s/AKfycbxziwqk0QdRhvTOvFoTQ3dL3R0zOkCtmlbBwZFz_sPNzbdbtBOy1skLoGJgmXVZFKXqIA/exec'
	const form = document.forms['requestClub-form']

	form.addEventListener('submit', e => {
		e.preventDefault()
		fetch(scriptURL, { method: 'POST', body: new FormData(form) })
			.then(response => response.json())
			.then(response => console.log('Success!', response))
			.catch(error => console.error('Error!', error.message))
	})
</script>
